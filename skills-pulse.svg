<svg width="760" height="150" viewBox="0 0 760 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
  </defs>
  <rect width="760" height="150" rx="10" fill="url(#bg2)"/>
  <rect x="0.5" y="0.5" width="759" height="149" rx="10" fill="none" stroke="#1c2733"/>

  <!-- pulse line -->
  <polyline points="20,75 120,75 140,30 160,120 180,50 200,100 220,75 320,75 340,20 360,130 380,75 760,75"
            fill="none" stroke="#00F7FF" stroke-width="2" opacity="0.85">
    <animate attributeName="stroke-dasharray" values="0,2000;2000,0" dur="4s" repeatCount="indefinite"/>
  </polyline>

  <!-- floating skill tags -->
  <g font-family="Consolas,Menlo,monospace" font-size="14" fill="#7ee787">
    <text x="60" y="45">
      Python
      <animate attributeName="y" values="45;38;45" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="220" y="115">
      RAG
      <animate attributeName="y" values="115;108;115" dur="3.4s" repeatCount="indefinite"/>
    </text>
    <text x="380" y="45">
      FastAPI
      <animate attributeName="y" values="45;38;45" dur="2.6s" repeatCount="indefinite"/>
    </text>
    <text x="520" y="115">
      Ollama
      <animate attributeName="y" values="115;108;115" dur="3.8s" repeatCount="indefinite"/>
    </text>
    <text x="640" y="45">
      OpenCV
      <animate attributeName="y" values="45;38;45" dur="3.1s" repeatCount="indefinite"/>
    </text>
  </g>

  <circle cx="20" cy="75" r="4" fill="#00F7FF">
    <animate attributeName="cx" values="20;760;20" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
